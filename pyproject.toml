[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyck"
version = "1.0.0"
description = "A modern Python package manager and runtime toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
pym = "pym.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pym*"]
